name: checks

# Lint, offline tests and secret scanning. No job ever visits a real website: results depend
# on the source IP, and a scheduled audit from a CI region would measure the wrong country.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Windows is the platform the tool is developed on, and Chromium's sandbox works there
    # without relaxing kernel settings, which Ubuntu 24.04 runners would require.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install --no-cache-dir -r requirements-dev.txt
      - name: Install Chromium for the offline browser tests
        run: python -m playwright install chromium --no-shell
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Scan for secrets
        run: detect-secrets-hook --baseline .secrets.baseline (git ls-files)
      - name: Test
        run: python -m pytest -q
